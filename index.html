<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymLog">
    <title>GymLog - Workout Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #EF4444;
            --background: #0F172A;
            --surface: #1E293B;
            --foreground: #F1F5F9;
            --muted: #94A3B8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.5;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            padding-top: max(8px, env(safe-area-inset-top));
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border);
            background-color: var(--background);
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            padding-top: 8px;
        }

        .tab-button {
            flex: 1;
            padding: 0;
            border: none;
            background: none;
            color: var(--muted);
            font-size: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            min-height: 60px;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .tab-button.active {
            color: var(--primary);
            opacity: 1;
        }

        .tab-button:active {
            opacity: 0.8;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            background-color: var(--primary);
            color: white;
        }

        .button:active {
            opacity: 0.8;
        }

        .button-secondary {
            background-color: var(--surface);
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .button-danger {
            background-color: #EF4444;
            color: white;
        }

        .button-success {
            background-color: #22C55E;
            color: white;
        }

        .stat-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .stat-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .stat-row-item {
            flex: 1;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-row-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-row-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--foreground);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface);
            color: var(--foreground);
            font-size: 16px;
            margin-bottom: 12px;
        }

        .exercise-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .exercise-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--foreground);
        }

        .exercise-category {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .set-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            font-size: 14px;
        }

        .set-input {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--background);
            color: var(--foreground);
            font-size: 12px;
        }

        .timer {
            font-size: 42px;
            font-weight: 800;
            text-align: center;
            margin: 12px 0;
            font-variant-numeric: tabular-nums;
        }

        .workout-item {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .workout-item-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--foreground);
        }

        .workout-item-date {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .workout-item-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--muted);
            margin-top: 8px;
        }

        .small-button {
            padding: 8px 12px;
            font-size: 14px;
            margin-bottom: 0;
            margin-right: 8px;
            display: inline-block;
            width: auto;
        }

        .rest-timer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .rest-timer-modal.active {
            display: flex;
        }

        .rest-timer-content {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            max-width: 300px;
        }

        .rest-timer-time {
            font-size: 64px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
            font-variant-numeric: tabular-nums;
        }

        .rest-timer-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .rest-timer-controls input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--background);
            color: var(--foreground);
            font-size: 16px;
            text-align: center;
        }

        .rest-timer-presets {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preset-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--background);
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .preset-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .chart-container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--foreground);
            margin-bottom: 12px;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 200px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chart-bar {
            flex: 1;
            min-width: 40px;
            background-color: var(--primary);
            border-radius: 4px 4px 0 0;
            position: relative;
            cursor: pointer;
        }

        .chart-bar-value {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 600;
            color: var(--foreground);
            white-space: nowrap;
        }

        .chart-bar-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
        }

        .chart-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 32px;
            font-size: 12px;
            color: var(--muted);
        }

        .chart-stat {
            text-align: center;
        }

        .chart-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--foreground);
            margin-bottom: 4px;
        }

        .exercise-dropdown {
            position: relative;
            margin-bottom: 12px;
        }

        .exercise-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface);
            color: var(--foreground);
            font-size: 16px;
        }

        .exercise-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 100;
        }

        .exercise-list.active {
            display: block;
        }

        .exercise-option {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 14px;
            color: var(--foreground);
        }

        .exercise-option:last-child {
            border-bottom: none;
        }

        .exercise-option:active {
            background-color: var(--primary);
            color: white;
        }

        .exercise-option-category {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .quote {
            background-color: var(--surface);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 13px;
            font-style: italic;
            color: var(--muted);
        }

        .template-quick-btn {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            cursor: pointer;
            color: var(--foreground);
        }

        .template-quick-btn:active {
            opacity: 0.7;
        }

        .pr-badge {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>GymLog</h1>
        </div>

        <div class="content" id="content">
            <!-- Home Screen -->
            <div id="home-screen" class="screen active">
                <button class="button" id="start-btn" style="background-color: #22C55E; margin-bottom: 12px;">💪 Start Workout</button>
                
                <div class="stat-row">
                    <div class="stat-row-item">
                        <div class="stat-row-value" id="streak-value">0</div>
                        <div class="stat-row-label">🔥 Streak</div>
                    </div>
                    <div class="stat-row-item">
                        <div class="stat-row-value" id="workouts-count">0</div>
                        <div class="stat-row-label">Total</div>
                    </div>
                </div>

                <div id="this-week-stats" class="stat-card" style="display: none;">
                    <div style="font-size: 13px; color: var(--muted); margin-bottom: 8px;">This Week</div>
                    <div id="week-stats-text" style="font-size: 14px; color: var(--foreground);"></div>
                </div>

                <div id="last-workout" class="stat-card" style="display: none;">
                    <div style="font-size: 12px; color: var(--muted); margin-bottom: 4px;">Last Workout</div>
                    <div id="last-workout-text" style="font-size: 14px; color: var(--foreground); font-weight: 600;"></div>
                </div>

                <div id="weekly-volume" class="chart-container" style="display: none;">
                    <div class="chart-title">Weekly Volume</div>
                    <div id="volume-chart" class="chart"></div>
                </div>

                <div id="top-prs" style="display: none;">
                    <div style="font-size: 13px; font-weight: 700; color: var(--foreground); margin-bottom: 8px;">🏆 Top Lifts</div>
                    <div id="top-prs-list"></div>
                </div>

                <div id="body-parts" class="stat-card" style="display: none;">
                    <div style="font-size: 12px; color: var(--muted); margin-bottom: 4px;">Body Parts This Week</div>
                    <div id="body-parts-text" style="font-size: 13px; color: var(--foreground);"></div>
                </div>

                <div id="daily-frequency" class="chart-container" style="display: none;">
                    <div class="chart-title">Workouts This Week</div>
                    <div id="frequency-chart" class="chart"></div>
                </div>

                <div id="motivation-quote" class="quote" style="display: none;"></div>

                <div id="recent-workouts"></div>
            </div>

            <!-- Workout Screen -->
            <div id="workout-screen" class="screen">
                <div class="timer" id="timer">00:00</div>
                <input type="text" id="workout-name" class="input-field" placeholder="Workout name">
                <div id="exercises-list"></div>
                <button class="button" id="add-exercise-btn">+ Add Exercise</button>
                <button class="button button-success" id="finish-btn">Finish Workout</button>
                <button class="button button-secondary" id="discard-btn">Discard</button>
            </div>

            <!-- History Screen -->
            <div id="history-screen" class="screen">
                <div id="history-list"></div>
            </div>

            <!-- Progress Screen -->
            <div id="progress-screen" class="screen">
                <div id="progress-list"></div>
            </div>

            <!-- Templates Screen -->
            <div id="templates-screen" class="screen">
                <button class="button" id="create-template-btn">+ Create Template</button>
                <div id="templates-list"></div>
            </div>
        </div>

        <!-- Exercise Selector Modal -->
        <div id="exercise-modal" class="rest-timer-modal">
            <div class="rest-timer-content" style="max-width: 350px; text-align: left;">
                <div style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Add Exercise</div>
                <div class="exercise-dropdown">
                    <input type="text" id="exercise-input" class="exercise-input" placeholder="Search or type exercise...">
                    <div id="exercise-list" class="exercise-list"></div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="exercise-category" class="input-field" placeholder="Category" style="flex: 1; margin: 0;">
                    <button class="button small-button" onclick="addExerciseFromModal()" style="width: auto; padding: 10px 16px; margin: 0;">Add</button>
                </div>
                <button class="button button-secondary" onclick="closeExerciseModal()" style="margin-top: 12px;">Cancel</button>
            </div>
        </div>

        <!-- Rest Timer Modal -->
        <div id="rest-timer-modal" class="rest-timer-modal">
            <div class="rest-timer-content">
                <div class="rest-timer-time" id="rest-time">1:30</div>
                <div class="rest-timer-controls">
                    <input type="number" id="rest-input" min="10" max="600" value="90" placeholder="seconds">
                    <button class="button small-button" onclick="startRestTimer()" style="width: auto; padding: 10px 16px; margin: 0;">Start</button>
                </div>
                <div class="rest-timer-presets">
                    <button class="preset-btn" onclick="setRestDuration(30)">30s</button>
                    <button class="preset-btn" onclick="setRestDuration(60)">1m</button>
                    <button class="preset-btn active" onclick="setRestDuration(90)">1:30</button>
                    <button class="preset-btn" onclick="setRestDuration(120)">2m</button>
                    <button class="preset-btn" onclick="setRestDuration(180)">3m</button>
                </div>
                <button class="button button-secondary" onclick="closeRestTimer()">Close</button>
            </div>
        </div>

        <!-- Create Template Modal -->
        <div id="create-template-modal" class="rest-timer-modal">
            <div class="rest-timer-content" style="max-width: 350px; text-align: left;">
                <div style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Create Template</div>
                <input type="text" id="template-name-input" class="input-field" placeholder="Template name (e.g., Push Day)">
                <div id="template-exercises-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>
                <button class="button" onclick="saveNewTemplate()">Save Template</button>
                <button class="button button-secondary" onclick="closeCreateTemplateModal()">Cancel</button>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tabs">
            <button class="tab-button active" id="tab-home" title="Home">🏠</button>
            <button class="tab-button" id="tab-history" title="History">⏱️</button>
            <button class="tab-button" id="tab-progress" title="Progress">📈</button>
            <button class="tab-button" id="tab-templates" title="Templates">📋</button>
        </div>
    </div>

    <script>
        const EXERCISES = [
            { id: 'bench', name: 'Bench Press', cat: 'Chest' },
            { id: 'squat', name: 'Squat', cat: 'Legs' },
            { id: 'deadlift', name: 'Deadlift', cat: 'Full Body' },
            { id: 'pullup', name: 'Pull-up', cat: 'Back' },
            { id: 'dip', name: 'Dip', cat: 'Chest' },
            { id: 'row', name: 'Barbell Row', cat: 'Back' },
            { id: 'ohp', name: 'Shoulder Press', cat: 'Shoulders' },
            { id: 'curl', name: 'Bicep Curl', cat: 'Arms' },
            { id: 'tricep', name: 'Tricep Ext', cat: 'Arms' },
            { id: 'legpress', name: 'Leg Press', cat: 'Legs' },
            { id: 'pushup', name: 'Push-up', cat: 'Chest' },
            { id: 'plank', name: 'Plank', cat: 'Core' },
        ];

        const QUOTES = [
            "The iron never lies.",
            "Discipline is choosing between what you want now and what you want most.",
            "Your body can stand almost anything. It's your mind that you need to convince.",
            "Success is the sum of small efforts repeated day in and day out.",
            "The only bad workout is the one that didn't happen.",
            "Pain is temporary, pride is forever.",
            "Lift heavy, feel alive.",
            "Train insane or remain the same.",
        ];

        let workouts = JSON.parse(localStorage.getItem('workouts') || '[]');
        let templates = JSON.parse(localStorage.getItem('templates') || '[]');
        let pastExercises = JSON.parse(localStorage.getItem('pastExercises') || '[]');
        let activeWorkout = null;
        let timerInterval = null;
        let restTimerInterval = null;
        let restDuration = 90;
        let currentTab = 'home';

        function saveData() {
            localStorage.setItem('workouts', JSON.stringify(workouts));
            localStorage.setItem('templates', JSON.stringify(templates));
            localStorage.setItem('pastExercises', JSON.stringify(pastExercises));
        }

        function getPastExercises() {
            const seen = new Set();
            return pastExercises.filter(ex => {
                if (seen.has(ex.name)) return false;
                seen.add(ex.name);
                return true;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            const screens = { home: 'home-screen', history: 'history-screen', progress: 'progress-screen', templates: 'templates-screen' };
            document.getElementById(screens[tab]).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            
            if (tab === 'history') renderHistory();
            if (tab === 'progress') renderProgress();
            if (tab === 'templates') renderTemplates();
            if (tab === 'home') renderHome();
        }

        function getWeeklyStats() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const thisWeek = workouts.filter(w => new Date(w.date) > weekAgo);
            
            let totalVolume = 0;
            let bodyParts = new Set();
            
            thisWeek.forEach(w => {
                w.exercises.forEach(e => {
                    bodyParts.add(e.cat);
                    totalVolume += e.sets.reduce((a, s) => a + (s.weight * s.reps), 0);
                });
            });
            
            return { count: thisWeek.length, volume: totalVolume, bodyParts: Array.from(bodyParts) };
        }

        function getTopPRs() {
            const stats = {};
            workouts.forEach(w => {
                w.exercises.forEach(e => {
                    if (!stats[e.name]) stats[e.name] = { cat: e.cat, max: 0 };
                    const max = Math.max(...e.sets.map(s => s.weight));
                    stats[e.name].max = Math.max(stats[e.name].max, max);
                });
            });
            
            return Object.entries(stats)
                .filter(([_, s]) => s.max > 0)
                .sort((a, b) => b[1].max - a[1].max)
                .slice(0, 3);
        }

        function renderHome() {
            document.getElementById('workouts-count').textContent = workouts.length;
            
            // Streak
            let streak = 0;
            const today = new Date();
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toDateString();
                if (workouts.some(w => new Date(w.date).toDateString() === dateStr)) {
                    streak++;
                } else if (i > 0) {
                    break;
                }
            }
            document.getElementById('streak-value').textContent = streak;
            
            // Weekly stats
            const weekStats = getWeeklyStats();
            const weekEl = document.getElementById('this-week-stats');
            if (weekStats.count > 0) {
                weekEl.style.display = 'block';
                document.getElementById('week-stats-text').textContent = `${weekStats.count} workouts • ${Math.round(weekStats.volume / 1000)}k kg`;
            }
            
            // Last workout
            if (workouts.length > 0) {
                const last = workouts[workouts.length - 1];
                document.getElementById('last-workout').style.display = 'block';
                const date = new Date(last.date).toLocaleDateString();
                document.getElementById('last-workout-text').textContent = `${last.name} • ${date}`;
            }
            
            // Top PRs
            const topPRs = getTopPRs();
            if (topPRs.length > 0) {
                document.getElementById('top-prs').style.display = 'block';
                document.getElementById('top-prs-list').innerHTML = topPRs.map(([name, s]) => `
                    <div class="exercise-card">
                        <div class="exercise-name">${name} <span class="pr-badge">${s.max}kg</span></div>
                    </div>
                `).join('');
            }
            
            // Body parts
            if (weekStats.bodyParts.length > 0) {
                document.getElementById('body-parts').style.display = 'block';
                document.getElementById('body-parts-text').textContent = weekStats.bodyParts.join(', ');
            }
            
            // Weekly frequency chart
            if (workouts.length > 0) {
                const now = new Date();
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                const days = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(d.getDate() - i);
                    const count = workouts.filter(w => new Date(w.date).toDateString() === d.toDateString()).length;
                    days.push({ date: d.toLocaleDateString('en-US', { weekday: 'short' }), count });
                }
                
                const maxCount = Math.max(...days.map(d => d.count), 1);
                document.getElementById('daily-frequency').style.display = 'block';
                document.getElementById('frequency-chart').innerHTML = days.map(d => `
                    <div class="chart-bar" style="height: ${(d.count / maxCount) * 100}%;">
                        <div class="chart-bar-label">${d.date}</div>
                    </div>
                `).join('');
            }
            
            // Motivation quote
            const quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
            document.getElementById('motivation-quote').style.display = 'block';
            document.getElementById('motivation-quote').textContent = `"${quote}"`;
            
            // Recent workouts
            const recent = workouts.slice(-5).reverse().map(w => `
                <div class="workout-item" onclick="viewWorkout('${w.id}')">
                    <div class="workout-item-title">${w.name}</div>
                    <div class="workout-item-date">${new Date(w.date).toLocaleDateString()}</div>
                    <div class="workout-item-meta">
                        <span>${w.exercises.length} ex</span>
                        <span>${Math.round((w.duration || 0) / 60)}m</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('recent-workouts').innerHTML = recent || '<div class="empty-state"><div class="empty-state-icon">💪</div><div class="empty-state-title">No workouts yet</div></div>';
        }

        function startWorkout() {
            activeWorkout = {
                id: Date.now().toString(),
                name: 'Workout',
                date: new Date().toISOString(),
                startTime: Date.now(),
                exercises: [],
                duration: 0
            };
            switchTab('home');
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('workout-screen').style.display = 'block';
            document.getElementById('workout-name').value = activeWorkout.name;
            renderWorkout();
            startTimer();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - activeWorkout.startTime) / 1000);
                const m = Math.floor(elapsed / 60);
                const s = elapsed % 60;
                document.getElementById('timer').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function getLastSetForExercise(exerciseName) {
            for (let i = workouts.length - 1; i >= 0; i--) {
                const w = workouts[i];
                const exercise = w.exercises.find(e => e.name === exerciseName);
                if (exercise && exercise.sets.length > 0) {
                    const lastSet = exercise.sets[exercise.sets.length - 1];
                    return lastSet;
                }
            }
            return null;
        }

        function renderWorkout() {
            const html = activeWorkout.exercises.map((ex, i) => {
                const lastSet = getLastSetForExercise(ex.name);
                return `
                <div class="exercise-card">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <div class="exercise-name">${ex.name}</div>
                            <div class="exercise-category">${ex.cat}</div>
                        </div>
                        ${lastSet ? `<div style="font-size: 12px; color: var(--muted); text-align: right;">
                            <div style="font-weight: 600; color: var(--foreground);">Last: ${lastSet.weight}kg × ${lastSet.reps}</div>
                            <div>Previous set</div>
                        </div>` : ''}
                    </div>
                    ${ex.sets.map((set, j) => `
                        <div class="set-row">
                            <span>${j + 1}</span>
                            <input type="number" class="set-input" placeholder="kg" value="${set.weight}" onchange="updateSet(${i}, ${j}, 'weight', this.value)">
                            <span>×</span>
                            <input type="number" class="set-input" placeholder="reps" value="${set.reps}" onchange="updateSet(${i}, ${j}, 'reps', this.value)">
                            <input type="checkbox" ${set.done ? 'checked' : ''} onchange="toggleSet(${i}, ${j}, this.checked)">
                        </div>
                    `).join('')}
                    <button class="button button-secondary small-button" onclick="addSet(${i})">+ Set</button>
                    <button class="button button-danger small-button" onclick="removeExercise(${i})">Remove</button>
                </div>
                    `;
            }).join('');
            document.getElementById('exercises-list').innerHTML = html;
        }

        function openExerciseModal() {
            document.getElementById('exercise-modal').classList.add('active');
            document.getElementById('exercise-input').value = '';
            document.getElementById('exercise-category').value = '';
            renderExerciseList();
        }

        function closeExerciseModal() {
            document.getElementById('exercise-modal').classList.remove('active');
        }

        function renderExerciseList() {
            const input = document.getElementById('exercise-input').value.toLowerCase();
            const past = getPastExercises();
            
            let options = [];
            
            if (input === '') {
                options = past.map(ex => `
                    <div class="exercise-option" onclick="selectExercise('${ex.name}', '${ex.cat}')">
                        ${ex.name}
                        <div class="exercise-option-category">${ex.cat}</div>
                    </div>
                `);
            } else {
                const filtered = past.filter(ex => ex.name.toLowerCase().includes(input) || ex.cat.toLowerCase().includes(input));
                options = filtered.map(ex => `
                    <div class="exercise-option" onclick="selectExercise('${ex.name}', '${ex.cat}')">
                        ${ex.name}
                        <div class="exercise-option-category">${ex.cat}</div>
                    </div>
                `);
            }
            
            const list = document.getElementById('exercise-list');
            list.innerHTML = options.join('');
            list.classList.toggle('active', options.length > 0);
        }

        function selectExercise(name, cat) {
            document.getElementById('exercise-input').value = name;
            document.getElementById('exercise-category').value = cat;
            document.getElementById('exercise-list').classList.remove('active');
        }

        function addExerciseFromModal() {
            const name = document.getElementById('exercise-input').value.trim();
            const cat = document.getElementById('exercise-category').value.trim() || 'Full Body';
            
            if (!name) {
                alert('Enter exercise name');
                return;
            }
            
            activeWorkout.exercises.push({ name, cat, sets: [{ weight: 0, reps: 0, done: false }] });
            pastExercises.push({ name, cat, date: new Date().toISOString() });
            saveData();
            
            renderWorkout();
            closeExerciseModal();
        }

        function removeExercise(i) {
            activeWorkout.exercises.splice(i, 1);
            renderWorkout();
        }

        function addSet(i) {
            const lastSet = activeWorkout.exercises[i].sets[activeWorkout.exercises[i].sets.length - 1];
            activeWorkout.exercises[i].sets.push({ weight: lastSet.weight, reps: lastSet.reps, done: false });
            renderWorkout();
        }

        function updateSet(i, j, field, value) {
            if (field === 'weight' || field === 'reps') {
                activeWorkout.exercises[i].sets[j][field] = parseInt(value) || 0;
            } else {
                activeWorkout.exercises[i].sets[j][field] = value;
            }
        }

        function toggleSet(i, j, done) {
            activeWorkout.exercises[i].sets[j].done = done;
            if (done) openRestTimer();
        }

        function openRestTimer() {
            document.getElementById('rest-timer-modal').classList.add('active');
            document.getElementById('rest-input').value = restDuration;
        }

        function closeRestTimer() {
            document.getElementById('rest-timer-modal').classList.remove('active');
            if (restTimerInterval) clearInterval(restTimerInterval);
        }

        function setRestDuration(seconds) {
            restDuration = seconds;
            document.getElementById('rest-input').value = seconds;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function startRestTimer() {
            const seconds = parseInt(document.getElementById('rest-input').value) || 90;
            restDuration = seconds;
            let remaining = seconds;
            
            if (restTimerInterval) clearInterval(restTimerInterval);
            
            const update = () => {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                document.getElementById('rest-time').textContent = `${m}:${String(s).padStart(2, '0')}`;
                
                if (remaining <= 0) {
                    clearInterval(restTimerInterval);
                    if ('vibrate' in navigator) navigator.vibrate(200);
                    playTimerSound();
                    return;
                }
                remaining--;
            };
            
            update();
            restTimerInterval = setInterval(update, 1000);
        }

        function playTimerSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {}
        }

        function finishWorkout() {
            if (activeWorkout.exercises.length === 0) {
                alert('Add at least one exercise');
                return;
            }
            activeWorkout.name = document.getElementById('workout-name').value || 'Workout';
            activeWorkout.duration = Date.now() - activeWorkout.startTime;
            workouts.push(activeWorkout);
            saveData();
            activeWorkout = null;
            clearInterval(timerInterval);
            if (restTimerInterval) clearInterval(restTimerInterval);
            document.getElementById('home-screen').style.display = 'block';
            document.getElementById('workout-screen').style.display = 'none';
            renderHome();
        }

        function discardWorkout() {
            if (confirm('Discard workout?')) {
                activeWorkout = null;
                clearInterval(timerInterval);
                if (restTimerInterval) clearInterval(restTimerInterval);
                document.getElementById('home-screen').style.display = 'block';
                document.getElementById('workout-screen').style.display = 'none';
            }
        }

        function renderHistory() {
            const html = workouts.length ? workouts.slice().reverse().map(w => `
                <div class="workout-item" onclick="viewWorkout('${w.id}')">
                    <div class="workout-item-title">${w.name}</div>
                    <div class="workout-item-date">${new Date(w.date).toLocaleDateString()}</div>
                    <div class="workout-item-meta">
                        <span>${w.exercises.length} exercises</span>
                        <span>${Math.round(w.duration / 60000)} min</span>
                    </div>
                </div>
            `).join('') : '<div class="empty-state"><div class="empty-state-icon">⏱️</div><div class="empty-state-title">No history</div></div>';
            document.getElementById('history-list').innerHTML = html;
        }

        function viewWorkout(id) {
            const w = workouts.find(x => x.id === id);
            if (!w) return;
            alert(`${w.name}\n${w.exercises.map(e => `${e.name}: ${e.sets.map(s => `${s.weight}kg×${s.reps}`).join(', ')}`).join('\n')}`);
        }

        function renderProgress() {
            const stats = {};
            workouts.forEach(w => {
                w.exercises.forEach(e => {
                    if (!stats[e.name]) stats[e.name] = { cat: e.cat, sessions: [], maxWeight: 0 };
                    const maxWeight = Math.max(...e.sets.map(s => s.weight));
                    stats[e.name].sessions.push({ date: new Date(w.date).toLocaleDateString(), weight: maxWeight });
                    stats[e.name].maxWeight = Math.max(stats[e.name].maxWeight, maxWeight);
                });
            });

            const html = Object.entries(stats).length ? Object.entries(stats).map(([name, s]) => {
                const maxVal = Math.max(...s.sessions.map(x => x.weight));
                const minVal = Math.min(...s.sessions.map(x => x.weight));
                const improvement = maxVal - minVal;
                
                return `
                    <div class="chart-container">
                        <div class="chart-title">${name}</div>
                        <div class="chart">
                            ${s.sessions.map(session => `
                                <div class="chart-bar" style="height: ${(session.weight / maxVal) * 100}%;">
                                    <div class="chart-bar-value">${session.weight}kg</div>
                                    <div class="chart-bar-label">${session.date}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="chart-stats">
                            <div class="chart-stat">
                                <div class="chart-stat-value">${maxVal}kg</div>
                                <div>Max</div>
                            </div>
                            <div class="chart-stat">
                                <div class="chart-stat-value">${minVal}kg</div>
                                <div>Min</div>
                            </div>
                            <div class="chart-stat">
                                <div class="chart-stat-value">+${improvement}kg</div>
                                <div>Gain</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') : '<div class="empty-state"><div class="empty-state-icon">📈</div><div class="empty-state-title">No data</div></div>';
            
            document.getElementById('progress-list').innerHTML = html;
        }

        function renderTemplates() {
            const html = templates.length ? templates.map(t => `
                <div class="exercise-card">
                    <div class="exercise-name">${t.name}</div>
                    <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">${t.exercises.length} exercises</div>
                    <button class="button small-button" onclick="startFromTemplate('${t.id}')">Start</button>
                    <button class="button button-danger small-button" onclick="deleteTemplate('${t.id}')">Delete</button>
                </div>
            `).join('') : '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No templates</div></div>';
            document.getElementById('templates-list').innerHTML = html;
        }

        function startFromTemplate(id) {
            const t = templates.find(x => x.id === id);
            if (!t) return;
            activeWorkout = {
                id: Date.now().toString(),
                name: t.name,
                date: new Date().toISOString(),
                startTime: Date.now(),
                exercises: JSON.parse(JSON.stringify(t.exercises)),
                duration: 0
            };
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('workout-screen').style.display = 'block';
            document.getElementById('workout-name').value = activeWorkout.name;
            renderWorkout();
            startTimer();
        }

        function deleteTemplate(id) {
            if (confirm('Delete template?')) {
                templates = templates.filter(t => t.id !== id);
                saveData();
                renderTemplates();
            }
        }

        function openCreateTemplateModal() {
            document.getElementById('create-template-modal').classList.add('active');
            document.getElementById('template-name-input').value = '';
            
            const past = getPastExercises();
            const html = past.map(ex => `
                <label style="display: flex; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); cursor: pointer;">
                    <input type="checkbox" class="template-exercise-checkbox" value="${ex.name}" data-cat="${ex.cat}" style="margin-right: 8px;">
                    <div>
                        <div style="font-size: 13px; color: var(--foreground);">${ex.name}</div>
                        <div style="font-size: 11px; color: var(--muted);">${ex.cat}</div>
                    </div>
                </label>
            `).join('');
            document.getElementById('template-exercises-list').innerHTML = html;
        }

        function closeCreateTemplateModal() {
            document.getElementById('create-template-modal').classList.remove('active');
        }

        function saveNewTemplate() {
            const name = document.getElementById('template-name-input').value.trim();
            if (!name) {
                alert('Enter template name');
                return;
            }
            
            const selected = Array.from(document.querySelectorAll('.template-exercise-checkbox:checked')).map(cb => ({
                name: cb.value,
                cat: cb.dataset.cat,
                sets: [{ weight: 0, reps: 0, done: false }]
            }));
            
            if (selected.length === 0) {
                alert('Select at least one exercise');
                return;
            }
            
            templates.push({
                id: Date.now().toString(),
                name,
                exercises: selected
            });
            
            saveData();
            closeCreateTemplateModal();
            renderTemplates();
            alert('Template saved!');
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', startWorkout);
        document.getElementById('add-exercise-btn').addEventListener('click', openExerciseModal);
        document.getElementById('finish-btn').addEventListener('click', finishWorkout);
        document.getElementById('discard-btn').addEventListener('click', discardWorkout);
        document.getElementById('create-template-btn').addEventListener('click', openCreateTemplateModal);
        document.getElementById('tab-home').addEventListener('click', () => switchTab('home'));
        document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
        document.getElementById('tab-progress').addEventListener('click', () => switchTab('progress'));
        document.getElementById('tab-templates').addEventListener('click', () => switchTab('templates'));
        document.getElementById('exercise-input').addEventListener('input', renderExerciseList);

        // Add greeting to header
        const headerEl = document.querySelector('.header');
        if (headerEl && !headerEl.querySelector('p')) {
            const p = document.createElement('p');
            p.style.fontSize = '14px';
            p.style.color = 'var(--muted)';
            p.style.margin = '4px 0 0 0';
            const hour = new Date().getHours();
            let greeting = 'Good morning, Sam';
            if (hour >= 12 && hour < 18) greeting = 'Good afternoon, Sam';
            if (hour >= 18) greeting = 'Good evening, Sam';
            p.textContent = greeting;
            headerEl.appendChild(p);
        }

        // Init
        renderHome();
    </script>
</body>
</html>
